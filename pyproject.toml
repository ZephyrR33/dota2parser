[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dota2parser"
version = "0.1.0"
description = "Embeddable OpenDota match history client"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
dota2parser = "dota2parser.__main__:main"

[tool.setuptools.packages.find]
include = ["dota2parser*"]
